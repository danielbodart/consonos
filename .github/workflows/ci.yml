name: Build and publish

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# trunk is production: every green push to it derives a new version from the
# git history and publishes a GitHub Release. A pull request builds
# everything but publishes nothing (and never sees the credentials).
#
# Least privilege for the built-in token: read-only by default, widened only
# on the job that publishes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Format and vet
        run: ./run check
      - name: Test
        run: ./run test

  # The flake: the package (its build runs the tests) and the home-manager
  # module's evaluation.
  nix:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the flake's version has its commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Flake check
        run: nix flake check -L

  release:
    runs-on: ubuntu-latest
    needs: [test, nix] # nothing is published unless both pass
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    permissions:
      contents: write # create the release and its tag
    steps:
      # The whole history, because the version's minor is the commit count and
      # the default shallow checkout would make every build claim to be the
      # first. ./run refuses to compute a version from a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4

      - name: Version
        id: version
        run: echo "value=$(./run version)" >> "$GITHUB_OUTPUT"

      # Every architecture's binary, the unit and their checksums, into
      # dist/release.
      - name: Build
        run: ./run release

      # A release whose binary disagrees with its tag is worse than none.
      - name: Check the version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          built=$(dist/release/consonos-linux-x64 --version)
          [ "$built" = "$VERSION" ] || { echo "the binary says $built but the release is $VERSION"; exit 1; }

      # The plain unit is checked against a real systemd, with the binary
      # where it expects to find it.
      - name: Verify the systemd unit
        run: |
          install -D -m 755 dist/release/consonos-linux-x64 "$HOME/.local/bin/consonos"
          mkdir -p "$HOME/.config"
          printf 'CONSONOS_SINK=sink\nCONSONOS_SPEAKER=speaker\n' > "$HOME/.config/consonos.env"
          systemd-analyze --user verify systemd/consonos.service

      # A re-run has the same run number and so the same version, so the
      # release may already exist: its assets are replaced rather than the job
      # failing.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            git log -1 --format=%B "$GITHUB_SHA" > notes.md
            gh release create "$tag" dist/release/* --target "$GITHUB_SHA" --title "$tag" --latest --notes-file notes.md
          fi
